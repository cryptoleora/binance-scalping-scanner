<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CryptoLeora Scanner</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080c12;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  width:95%;
  max-width:1400px;
  margin:auto;
  padding:20px 0;
}

h1{
  text-align:center;
  margin:5px 0 20px;
  color:#00ff99;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button,
input{
  border:none;
  border-radius:8px;
  padding:12px;
  font-size:14px;
}

input{
  background:#151b24;
  color:#fff;
  flex:1;
  min-width:180px;
}

button{
  background:#00c878;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#111720;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.stat small{
  color:#8b96a5;
}

.stat strong{
  display:block;
  margin-top:7px;
  font-size:18px;
}

.table-wrap{
  overflow-x:auto;
  background:#0f141c;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:#171e28;
  color:#8fffc9;
  padding:12px 8px;
  font-size:12px;
}

td{
  padding:11px 8px;
  border-bottom:1px solid #202733;
  text-align:center;
  font-size:13px;
}

.buy{
  color:#00ff99;
  font-weight:bold;
}

.sell{
  color:#ff4d67;
  font-weight:bold;
}

.neutral{
  color:#ffc857;
  font-weight:bold;
}

.pos{
  color:#00ff99;
}

.neg{
  color:#ff4d67;
}

.loading{
  text-align:center;
  padding:25px;
  color:#8b96a5;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 CryptoLeora Scanner</h1>

<div class="controls">

<input
  id="search"
  type="text"
  placeholder="Search coin..."
  oninput="render()"
>

<button onclick="scan()">🔎 SCAN</button>
<button onclick="setFilter('ALL')">ALL</button>
<button onclick="setFilter('BUY')">BUY</button>
<button onclick="setFilter('SELL')">SELL</button>

</div>

<div class="stats">

<div class="stat">
<small>BTC PRICE</small>
<strong id="btcPrice">--</strong>
</div>

<div class="stat">
<small>COINS</small>
<strong id="coinCount">--</strong>
</div>

<div class="stat">
<small>BUY SIGNALS</small>
<strong id="buyCount">--</strong>
</div>

<div class="stat">
<small>MARKET</small>
<strong id="marketStatus">--</strong>
</div>

<div class="stat">
<small>AVG SCORE</small>
<strong id="avgScore">--</strong>
</div>

</div>

<div id="status" class="loading">
Press SCAN
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>COIN</th>
<th>PRICE</th>
<th>24H %</th>
<th>VOLUME</th>
<th>RSI</th>
<th>EMA TREND</th>
<th>BTC STRENGTH</th>
<th>SIGNAL</th>
<th>SCORE</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>

const API="https://api.binance.com";

const COINS=[
"BTCUSDT",
"ETHUSDT",
"XRPUSDT",
"SUIUSDT",
"OPUSDT",
"SEIUSDT",
"NEARUSDT",
"ARBUSDT",
"APTUSDT",
"LINKUSDT",
"ADAUSDT",
"DOGEUSDT",
"AVAXUSDT",
"DOTUSDT",
"ATOMUSDT",
"INJUSDT",
"FILUSDT",
"UNIUSDT",
"AAVEUSDT",
"PEPEUSDT",
"TRXUSDT",
"TONUSDT",
"ICPUSDT",
"HBARUSDT",
"TAOUSDT",
"RENDERUSDT",
"FETUSDT",
"JUPUSDT",
"ENAUSDT",
"ONDOUSDT"
];

let results=[];
let filter="ALL";

function ema(data,period){

  const k=2/(period+1);

  let e=data[0];

  for(let i=1;i<data.length;i++){
    e=data[i]*k+e*(1-k);
  }

  return e;
}

function rsi(data,period=14){

  if(data.length<=period) return 50;

  let gains=0;
  let losses=0;

  for(let i=1;i<=period;i++){

    const diff=data[i]-data[i-1];

    if(diff>=0) gains+=diff;
    else losses+=Math.abs(diff);

  }

  let avgGain=gains/period;
  let avgLoss=losses/period;

  for(let i=period+1;i<data.length;i++){

    const diff=data[i]-data[i-1];

    const gain=diff>0?diff:0;
    const loss=diff<0?Math.abs(diff):0;

    avgGain=((avgGain*(period-1))+gain)/period;
    avgLoss=((avgLoss*(period-1))+loss)/period;
  }

  if(avgLoss===0) return 100;

  const rs=avgGain/avgLoss;

  return 100-(100/(1+rs));
}

function formatVolume(v){

  if(!Number.isFinite(v)) return "--";

  if(v>=1e12) return (v/1e12).toFixed(2)+"T";
  if(v>=1e9) return (v/1e9).toFixed(2)+"B";
  if(v>=1e6) return (v/1e6).toFixed(2)+"M";
  if(v>=1e3) return (v/1e3).toFixed(2)+"K";

  return v.toFixed(0);
}

/* FIXED 24H DATA */

async function get24h(symbol){

  try{

    const url=
      API+"/api/v3/ticker/24hr?symbol="+encodeURIComponent(symbol);

    const response=await fetch(url,{
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("24h HTTP "+response.status);
    }

    const data=await response.json();

    return {
      change:Number(data.priceChangePercent),
      volume:Number(data.quoteVolume),
      price:Number(data.lastPrice)
    };

  }catch(error){

    console.log("24H ERROR:",symbol,error);

    return {
      change:0,
      volume:0,
      price:0
    };
  }
}


/* BTC 24H */

async function getBTC24h(){

  try{

    const response=await fetch(
      API+"/api/v3/ticker/24hr?symbol=BTCUSDT",
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("BTC 24h error");
    }

    const data=await response.json();

    return Number(data.priceChangePercent);

  }catch(error){

    console.log("BTC ERROR:",error);

    return 0;
  }
}


/* KLINES */

async function getKlines(symbol){

  try{

    const url=
      API+
      "/api/v3/klines?symbol="+
      encodeURIComponent(symbol)+
      "&interval=15m&limit=100";

    const response=await fetch(url,{
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("KLINE HTTP "+response.status);
    }

    return await response.json();

  }catch(error){

    console.log("KLINE ERROR:",symbol,error);

    return [];
  }
}


/* ANALYZE */

async function analyze(symbol,btc24h){

  const candles=await getKlines(symbol);

  if(!candles.length){
    return null;
  }

  const closes=candles.map(x=>Number(x[4]));

  const volumes=candles.map(x=>Number(x[7]));

  const price=closes[closes.length-1];

  const ema10=ema(closes,10);
  const ema20=ema(closes,20);
  const ema55=ema(closes,55);

  const RSI=rsi(closes);

  const currentVolume=
    volumes[volumes.length-1];

  const previousVolumes=
    volumes.slice(-21,-1);

  const avgVolume=
    previousVolumes.length
    ?
    previousVolumes.reduce((a,b)=>a+b,0)/
    previousVolumes.length
    :
    currentVolume;

  const volumeRatio=
    avgVolume>0
    ?
    currentVolume/avgVolume
    :
    1;

  /* 15m momentum */

  const oldPrice=
    closes.length>=6
    ?
    closes[closes.length-6]
    :
    closes[0];

  const momentum=
    oldPrice>0
    ?
    ((price-oldPrice)/oldPrice)*100
    :
    0;

  /* BTC relative strength */

  const btcStrength=
    momentum-btc24h;

  let score=50;

  if(ema10>ema20) score+=10;
  else score-=10;

  if(ema20>ema55) score+=10;
  else score-=10;

  if(RSI>=40 && RSI<=60){
    score+=10;
  }
  else if(RSI<35){
    score+=5;
  }
  else if(RSI>70){
    score-=10;
  }

  if(volumeRatio>=1.5){
    score+=10;
  }
  else if(volumeRatio>=1.1){
    score+=5;
  }
  else if(volumeRatio<0.7){
    score-=5;
  }

  if(btcStrength>2){
    score+=10;
  }
  else if(btcStrength<-2){
    score-=10;
  }

  if(momentum>1){
    score+=5;
  }
  else if(momentum<-1){
    score-=5;
  }

  score=Math.max(0,Math.min(100,score));

  let signal="NEUTRAL";

  if(
    ema10>ema20 &&
    ema20>ema55 &&
    RSI>=40 &&
    RSI<=65 &&
    btcStrength>0 &&
    score>=70 &&
    volumeRatio>=0.9
  ){

    signal="BUY";

  }
  else if(
    ema10<ema20 &&
    ema20<ema55 &&
    RSI>=35 &&
    RSI<=70 &&
    btcStrength<0 &&
    score<=30
  ){

    signal="SELL";

  }

  let trend="SIDEWAYS";

  if(ema10>ema20 && ema20>ema55){
    trend="BULLISH";
  }
  else if(ema10<ema20 && ema20<ema55){
    trend="BEARISH";
  }

  /* GET 24H */

  const ticker=await get24h(symbol);

  return {

    symbol,

    price:ticker.price || price,

    change:ticker.change,

    volume:ticker.volume,

    RSI,

    trend,

    btcStrength,

    signal,

    score,

    volumeRatio,

    momentum

  };

}


/* SCAN */

async function scan(){

  const status=
    document.getElementById("status");

  status.innerText=
    "Scanning Binance market...";

  results=[];

  document.getElementById("tableBody").innerHTML="";

  const btc24h=await getBTC24h();

  let btcTicker;

  try{

    const response=await fetch(
      API+"/api/v3/ticker/price?symbol=BTCUSDT",
      {cache:"no-store"}
    );

    btcTicker=await response.json();

    document.getElementById("btcPrice").innerText=
      Number(btcTicker.price).toLocaleString(
        undefined,
        {
          maximumFractionDigits:2
        }
      );

  }catch(e){

    document.getElementById("btcPrice").innerText="--";

  }

  let buySignals=0;
  let scoreTotal=0;
  let successful=0;

  for(const symbol of COINS){

    try{

      const data=
        await analyze(symbol,btc24h);

      if(!data) continue;

      results.push(data);

      if(data.signal==="BUY"){
        buySignals++;
      }

      scoreTotal+=data.score;
      successful++;

      render();

    }catch(error){

      console.log("SCAN ERROR:",symbol,error);

    }

  }

  document.getElementById("coinCount").innerText=
    successful;

  document.getElementById("buyCount").innerText=
    buySignals;

  document.getElementById("avgScore").innerText=
    successful
    ?
    Math.round(scoreTotal/successful)
    :
    "--";

  if(btc24h>0){

    document.getElementById("marketStatus").innerText=
      "BULLISH";

  }
  else if(btc24h<0){

    document.getElementById("marketStatus").innerText=
      "BEARISH";

  }
  else{

    document.getElementById("marketStatus").innerText=
      "NEUTRAL";
  }

  status.innerText=
    "Scan complete • BTC 24H: "+
    btc24h.toFixed(2)+"%";

}


/* FILTER */

function setFilter(value){

  filter=value;

  render();

}


/* RENDER */

function render(){

  const body=
    document.getElementById("tableBody");

  const search=
    document
    .getElementById("search")
    .value
    .toUpperCase()
    .trim();

  body.innerHTML="";

  const filtered=
    results.filter(x=>{

      if(search &&
        !x.symbol.includes(search)
      ){
        return false;
      }

      if(filter==="BUY" &&
        x.signal!=="BUY"
      ){
        return false;
      }

      if(filter==="SELL" &&
        x.signal!=="SELL"
      ){
        return false;
      }

      return true;

    });

  for(const x of filtered){

    const tr=
      document.createElement("tr");

    const changeClass=
      x.change>=0
      ?
      "pos"
      :
      "neg";

    const strengthClass=
      x.btcStrength>=0
      ?
      "pos"
      :
      "neg";

    const signalClass=
      x.signal==="BUY"
      ?
      "buy"
      :
      x.signal==="SELL"
      ?
      "sell"
      :
      "neutral";

    tr.innerHTML=`

      <td><strong>${x.symbol.replace("USDT","")}</strong></td>

      <td>${Number(x.price).toPrecision(6)}</td>

      <td class="${changeClass}">
        ${x.change>=0?"+":""}${x.change.toFixed(2)}%
      </td>

      <td>${formatVolume(x.volume)}</td>

      <td>${x.RSI.toFixed(1)}</td>

      <td>${x.trend}</td>

      <td class="${strengthClass}">
        ${x.btcStrength>=0?"+":""}${x.btcStrength.toFixed(2)}%
      </td>

      <td class="${signalClass}">
        ${x.signal}
      </td>

      <td>
        <strong>${x.score}</strong>
      </td>

    `;

    body.appendChild(tr);

  }

}


/* AUTO REFRESH */

setInterval(()=>{

  scan();

},180000);

</script>

</body>
</html>
