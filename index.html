<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Scanner</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#080c12;
  color:#fff;
}

.header{
  padding:18px 20px;
  background:#0d131c;
  border-bottom:1px solid #202936;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.status{
  font-size:13px;
  color:#36d98b;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:0;
  padding:11px 18px;
  border-radius:8px;
  background:#1b2532;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#263445;
}

.scan{
  background:#168b5b;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.card{
  background:#0d131c;
  border:1px solid #202936;
  border-radius:12px;
  padding:16px;
}

.card-title{
  color:#8d9aaa;
  font-size:12px;
  margin-bottom:8px;
}

.card-value{
  font-size:23px;
  font-weight:bold;
}

.green{
  color:#36d98b;
}

.red{
  color:#ff5d6c;
}

.table-box{
  background:#0d131c;
  border:1px solid #202936;
  border-radius:12px;
  overflow:hidden;
}

.table-title{
  padding:16px;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #202936;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,td{
  padding:13px 12px;
  text-align:left;
  border-bottom:1px solid #1b232e;
  font-size:13px;
}

th{
  color:#8d9aaa;
  font-size:12px;
  background:#0b1017;
}

.token{
  font-weight:bold;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.buy{
  background:rgba(54,217,139,.12);
  color:#36d98b;
}

.sell{
  background:rgba(255,93,108,.12);
  color:#ff5d6c;
}

.wait{
  background:rgba(255,190,70,.12);
  color:#ffbe46;
}

@media(max-width:800px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .container{
    padding:12px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .card{
    padding:12px;
  }

  .card-value{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">🚀 Crypto Scanner</div>
  <div class="status" id="status">● Ready</div>
</header>

<main class="container">

  <div class="controls">
    <button class="scan" onclick="scanMarket()">🔎 Scan Market</button>
    <button onclick="filterCoins('ALL')">All</button>
    <button onclick="filterCoins('BUY')">Buy</button>
    <button onclick="filterCoins('SELL')">Sell</button>
  </div>

  <section class="cards">

    <div class="card">
      <div class="card-title">Market Status</div>
      <div class="card-value green" id="marketStatus">
        BULLISH
      </div>
    </div>

    <div class="card">
      <div class="card-title">BTC Price</div>
      <div class="card-value" id="btcPrice">
        Loading...
      </div>
    </div>

    <div class="card">
      <div class="card-title">Coins Scanned</div>
      <div class="card-value" id="coinCount">
        0
      </div>
    </div>

    <div class="card">
      <div class="card-title">Buy Signals</div>
      <div class="card-value green" id="buyCount">
        0
      </div>
    </div>

  </section>

  <section class="table-box">

    <div class="table-title">
      Market Scanner
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Token</th>
            <th>Price</th>
            <th>24H %</th>
            <th>RSI</th>
            <th>Trend</th>
            <th>Signal</th>
            <th>Score</th>
          </tr>
        </thead>

        <tbody id="coinTable">
        </tbody>

      </table>

    </div>

  </section>

</main>

<script>

let coins = [];

let currentFilter = "ALL";


async function getMarket(){

  try{

    const response = await fetch(
      "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=volume_desc&per_page=50&page=1&sparkline=false"
    );

    if(!response.ok){
      throw new Error("API Error");
    }

    const data = await response.json();

    coins = data.map((coin,index)=>{

      let change = coin.price_change_percentage_24h || 0;

      let rsi;

      if(change > 5){
        rsi = 68;
      }
      else if(change > 2){
        rsi = 60;
      }
      else if(change > 0){
        rsi = 52;
      }
      else if(change > -3){
        rsi = 45;
      }
      else{
        rsi = 35;
      }

      let trend;

      if(change > 2){
        trend = "UPTREND";
      }
      else if(change < -2){
        trend = "DOWNTREND";
      }
      else{
        trend = "SIDEWAYS";
      }

      let signal = "WAIT";

      if(rsi < 40 && change > -5){
        signal = "BUY";
      }
      else if(rsi > 70){
        signal = "SELL";
      }

      let score = Math.round(
        Math.min(
          100,
          Math.max(
            0,
            50 + change * 5 + (50-rsi)*0.3
          )
        )
      );

      return{
        name:coin.symbol.toUpperCase(),
        price:coin.current_price,
        change:change,
        rsi:rsi,
        trend:trend,
        signal:signal,
        score:score
      };

    });

    renderTable();

    document.getElementById("status").textContent =
      "● Live";

    document.getElementById("status").style.color =
      "#36d98b";

  }

  catch(error){

    document.getElementById("status").textContent =
      "● API Error";

    document.getElementById("status").style.color =
      "#ff5d6c";

    console.log(error);

  }

}


async function getBTC(){

  try{

    const response = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"
    );

    const data = await response.json();

    document.getElementById("btcPrice").textContent =
      "$" + Number(data.bitcoin.usd).toLocaleString();

  }

  catch(error){

    document.getElementById("btcPrice").textContent =
      "Unavailable";

  }

}


function renderTable(){

  const table =
    document.getElementById("coinTable");

  table.innerHTML = "";

  let filtered = coins;

  if(currentFilter !== "ALL"){

    filtered = coins.filter(
      coin => coin.signal === currentFilter
    );

  }

  filtered.forEach(coin=>{

    let changeClass =
      coin.change >= 0 ? "green" : "red";

    let signalClass =
      coin.signal === "BUY"
      ? "buy"
      : coin.signal === "SELL"
      ? "sell"
      : "wait";

    let row = document.createElement("tr");

    row.innerHTML = `

      <td class="token">
        ${coin.name}
      </td>

      <td>
        $${formatPrice(coin.price)}
      </td>

      <td class="${changeClass}">
        ${coin.change >= 0 ? "+" : ""}
        ${coin.change.toFixed(2)}%
      </td>

      <td>
        ${coin.rsi}
      </td>

      <td>
        ${coin.trend}
      </td>

      <td>
        <span class="badge ${signalClass}">
          ${coin.signal}
        </span>
      </td>

      <td>
        ${coin.score}/100
      </td>

    `;

    table.appendChild(row);

  });

  document.getElementById("coinCount").textContent =
    coins.length;

  document.getElementById("buyCount").textContent =
    coins.filter(c=>c.signal==="BUY").length;

}


function formatPrice(price){

  if(price >= 1){
    return price.toLocaleString(
      undefined,
      {
        maximumFractionDigits:4
      }
    );
  }

  return price.toFixed(6);

}


function filterCoins(filter){

  currentFilter = filter;

  renderTable();

}


function scanMarket(){

  document.getElementById("status").textContent =
    "● Scanning...";

  document.getElementById("status").style.color =
    "#ffbe46";

  getMarket();

}


getMarket();
getBTC();

setInterval(getMarket,60000);
setInterval(getBTC,60000);

</script>

</body>
</html>
