<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoLeora Scanner</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070b11;
color:#f5f7fa;
font-family:Arial,sans-serif
}

header{
padding:16px;
background:#0d131c;
border-bottom:1px solid #202936;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:20px;
font-weight:800
}

.live{
font-size:12px;
color:#35d88b
}

.container{
max-width:1250px;
margin:auto;
padding:15px
}

.controls{
display:flex;
gap:8px;
margin-bottom:15px;
flex-wrap:wrap
}

input{
flex:1;
min-width:180px;
background:#111923;
border:1px solid #263241;
border-radius:8px;
padding:12px;
color:white;
outline:none
}

button{
background:#17212d;
border:1px solid #263241;
color:white;
padding:11px 15px;
border-radius:8px;
font-weight:bold
}

.scan{
background:#087c50;
border-color:#087c50
}

.cards{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-bottom:15px
}

.card{
background:#0d131c;
border:1px solid #202936;
border-radius:10px;
padding:14px
}

.label{
font-size:11px;
color:#8995a5;
margin-bottom:7px
}

.value{
font-size:20px;
font-weight:800
}

.green{color:#35d88b}
.red{color:#ff5968}
.yellow{color:#ffbf4a}

.box{
background:#0d131c;
border:1px solid #202936;
border-radius:10px;
overflow:hidden
}

.boxhead{
padding:15px;
font-weight:800;
border-bottom:1px solid #202936
}

.tablewrap{
overflow-x:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:1150px
}

th,td{
padding:11px;
border-bottom:1px solid #1b2430;
text-align:left;
font-size:12px
}

th{
color:#8793a3;
font-size:11px;
background:#0b1017
}

.coin{
font-weight:800
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:15px;
font-size:10px;
font-weight:800
}

.buy{
color:#35d88b;
background:#103327
}

.sell{
color:#ff5968;
background:#35151b
}

.wait{
color:#ffbf4a;
background:#342915
}

.strong{
font-weight:800
}

.empty{
padding:35px;
text-align:center;
color:#8995a5
}

@media(max-width:800px){

.cards{
grid-template-columns:repeat(2,1fr)
}

.container{
padding:10px
}

header{
padding:13px
}

}

</style>
</head>

<body>

<header>

<div class="logo">🚀 CryptoLeora</div>

<div class="live" id="status">
● READY
</div>

</header>

<div class="container">

<div class="controls">

<input
id="search"
placeholder="Search BTC, ETH, SUI..."
oninput="render()">

<button class="scan" onclick="scan()">
🔎 SCAN
</button>

<button onclick="setFilter('ALL')">
ALL
</button>

<button onclick="setFilter('BUY')">
BUY
</button>

<button onclick="setFilter('SELL')">
SELL
</button>

</div>


<div class="cards">

<div class="card">
<div class="label">BTC PRICE</div>
<div class="value" id="btc">
$--
</div>
</div>

<div class="card">
<div class="label">COINS</div>
<div class="value" id="total">
0
</div>
</div>

<div class="card">
<div class="label">BUY SIGNALS</div>
<div class="value green" id="buys">
0
</div>
</div>

<div class="card">
<div class="label">MARKET</div>
<div class="value yellow" id="market">
--
</div>
</div>

<div class="card">
<div class="label">AVG SCORE</div>
<div class="value" id="avgScore">
--
</div>
</div>

</div>


<div class="box">

<div class="boxhead">
🔥 Binance Spot Scalping Scanner
</div>

<div class="tablewrap">

<table>

<thead>

<tr>

<th>COIN</th>
<th>PRICE</th>
<th>24H %</th>
<th>VOLUME</th>
<th>RSI</th>
<th>EMA TREND</th>
<th>BTC STRENGTH</th>
<th>SIGNAL</th>
<th>SCORE</th>

</tr>

</thead>

<tbody id="rows">

<tr>
<td colspan="9" class="empty">
Press SCAN to load market
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

let data=[];
let filter="ALL";
let btcChange=0;


/* -----------------------------
   COIN UNIVERSE
----------------------------- */

const coins=[

"BTCUSDT",
"ETHUSDT",
"XRPUSDT",
"SUIUSDT",
"OPUSDT",
"SEIUSDT",
"NEARUSDT",
"ARBUSDT",
"APTUSDT",
"LINKUSDT",
"ADAUSDT",
"DOGEUSDT",
"AVAXUSDT",
"DOTUSDT",
"ATOMUSDT",
"INJUSDT",
"FILUSDT",
"UNIUSDT",
"AAVEUSDT",
"PEPEUSDT",
"TRXUSDT",
"TONUSDT",
"ICPUSDT",
"HBARUSDT",
"TAOUSDT",
"RENDERUSDT",
"FETUSDT",
"JUPUSDT",
"ENAUSDT",
"ONDOUSDT"

];


/* -----------------------------
   API
----------------------------- */

async function getJSON(url){

const response=await fetch(url);

if(!response.ok){

throw new Error("API ERROR");

}

return await response.json();

}


/* -----------------------------
   EMA
----------------------------- */

function EMA(values,period){

if(values.length<period){

return values[values.length-1];

}

let multiplier=2/(period+1);

let ema=
values
.slice(0,period)
.reduce((a,b)=>a+b,0)/period;

for(let i=period;i<values.length;i++){

ema=
(values[i]-ema)*multiplier+ema;

}

return ema;

}


/* -----------------------------
   RSI
----------------------------- */

function RSI(values){

if(values.length<15){

return 50;

}

let gains=0;
let losses=0;

for(
let i=values.length-14;
i<values.length;
i++
){

let diff=
values[i]-values[i-1];

if(diff>0){

gains+=diff;

}else{

losses-=diff;

}

}

if(losses===0){

return 100;

}

let rs=gains/losses;

return Math.round(
100-(100/(1+rs))
);

}


/* -----------------------------
   VOLUME FORMAT
----------------------------- */

function formatVolume(value){

if(value>=1000000000){

return(
(value/1000000000).toFixed(2)+"B"
);

}

if(value>=1000000){

return(
(value/1000000).toFixed(2)+"M"
);

}

if(value>=1000){

return(
(value/1000).toFixed(2)+"K"
);

}

return value.toFixed(0);

}


/* -----------------------------
   ANALYZE COIN
----------------------------- */

async function analyze(symbol){

let url=
"https://api.binance.com/api/v3/klines"+
"?symbol="+symbol+
"&interval=15m"+
"&limit=100";

let candles=
await getJSON(url);


/* CLOSE */

let close=
candles.map(
x=>Number(x[4])
);


/* VOLUME */

let volumes=
candles.map(
x=>Number(x[7])
);


/* CURRENT */

let price=
close[close.length-1];


/* EMA */

let ema10=
EMA(close,10);

let ema20=
EMA(close,20);

let ema55=
EMA(close,55);


/* RSI */

let rsi=
RSI(close);


/* VOLUME */

let currentVolume=
volumes[volumes.length-1];

let oldVolumes=
volumes.slice(-21,-1);

let avgVolume=
oldVolumes.reduce(
(a,b)=>a+b,0
)/oldVolumes.length;

let volumeRatio=
avgVolume>0
?currentVolume/avgVolume
:1;


/* TREND */

let trend="SIDEWAYS";

if(
ema10>ema20 &&
ema20>ema55
){

trend="BULLISH";

}

else if(
ema10<ema20 &&
ema20<ema55
){

trend="BEARISH";

}


/* MOMENTUM */

let momentum=
(
close[close.length-1]/
close[close.length-5]-1
)*100;


/* BTC RELATIVE STRENGTH */

let btcStrength=
momentum-btcChange;


/* -----------------------------
   SCORE
----------------------------- */

let score=50;


/* EMA */

if(ema10>ema20){

score+=10;

}else{

score-=10;

}


if(ema20>ema55){

score+=10;

}else{

score-=10;

}


/* RSI */

if(rsi>=40 && rsi<=60){

score+=10;

}

else if(rsi<35){

score+=5;

}

else if(rsi>70){

score-=10;

}


/* VOLUME */

if(volumeRatio>=1.5){

score+=10;

}

else if(volumeRatio>=1.1){

score+=5;

}

else if(volumeRatio<0.7){

score-=5;

}


/* BTC STRENGTH */

if(btcStrength>2){

score+=10;

}

else if(btcStrength<-2){

score-=10;

}


/* MOMENTUM */

if(momentum>1){

score+=5;

}

else if(momentum<-1){

score-=5;

}


score=
Math.max(
0,
Math.min(
100,
Math.round(score)
)
);


/* -----------------------------
   SIGNAL
----------------------------- */

let signal="WAIT";


/*

STRICT BUY:

1. EMA10 > EMA20
2. EMA20 > EMA55
3. RSI 40-65
4. BTC relative strength positive
5. Score >=70
6. Volume >= average

*/

if(

ema10>ema20 &&

ema20>ema55 &&

rsi>=40 &&
rsi<=65 &&

btcStrength>0 &&

score>=70 &&

volumeRatio>=0.9

){

signal="BUY";

}


/*

SELL:

*/

if(

ema10<ema20 &&

ema20<ema55 &&

rsi>=35 &&
rsi<=70 &&

btcStrength<0 &&

score<=30

){

signal="SELL";

}


return{

symbol:
symbol.replace("USDT",""),

price,
change:0,
volume:currentVolume,
rsi,
trend,
btcStrength,
score,
signal

};

}


/* -----------------------------
   24H DATA
----------------------------- */

async function get24h(){

let url=
"https://api.binance.com/api/v3/ticker/24hr";

let result=
await getJSON(url);

let map={};

for(let x of result){

map[x.symbol]={
change:Number(x.priceChangePercent),
volume:Number(x.quoteVolume),
price:Number(x.lastPrice)
};

}

return map;

}


/* -----------------------------
   SCAN
----------------------------- */

async function scan(){

document.getElementById("status")
.textContent=
"● SCANNING...";

document.getElementById("status")
.style.color=
"#ffbf4a";

data=[];


try{

/* 24H */

let ticker=
await get24h();


/* BTC */

if(ticker.BTCUSDT){

btcChange=
ticker.BTCUSDT.change;

document.getElementById("btc")
.textContent=
"$"+
ticker.BTCUSDT.price.toLocaleString(
undefined,
{maximumFractionDigits:2}
);

}


/* ANALYZE */

for(let symbol of coins){

try{

let result=
await analyze(symbol);


/* 24H */

if(ticker[symbol]){

result.change=
ticker[symbol].change;

result.volume=
ticker[symbol].volume;

}


data.push(result);

render();

}
catch(error){

console.log(
"Skipped:",
symbol
);

}

}


updateStats();


document.getElementById("status")
.textContent=
"● LIVE";

document.getElementById("status")
.style.color=
"#35d88b";


}
catch(error){

console.log(error);

document.getElementById("status")
.textContent=
"● API ERROR";

document.getElementById("status")
.style.color=
"#ff5968";

}

}


/* -----------------------------
   RENDER
----------------------------- */

function render(){

let search=
document
.getElementById("search")
.value
.toUpperCase()
.trim();


let list=
data.filter(x=>{

let searchOK=
!search ||
x.symbol.includes(search);

let filterOK=
filter==="ALL" ||
x.signal===filter;

return searchOK && filterOK;

});


let html="";


for(let x of list){

let price=
x.price>=1
?
x.price.toLocaleString(
undefined,
{maximumFractionDigits:4}
)
:
x.price.toFixed(6);


let changeClass=
x.change>=0
?
"green"
:
"red";


let strengthClass=
x.btcStrength>=0
?
"green"
:
"red";


let signalClass=
x.signal==="BUY"
?
"buy"
:
x.signal==="SELL"
?
"sell"
:
"wait";


html+=`

<tr>

<td class="coin">
${x.symbol}
</td>

<td>
$${price}
</td>

<td class="${changeClass}">
${x.change>=0?"+":""}
${x.change.toFixed(2)}%
</td>

<td>
${formatVolume(x.volume)}
</td>

<td>
${x.rsi}
</td>

<td>
${x.trend}
</td>

<td class="${strengthClass}">
${x.btcStrength>=0?"+":""}
${x.btcStrength.toFixed(2)}%
</td>

<td>

<span class="badge ${signalClass}">
${x.signal}
</span>

</td>

<td class="strong">
${x.score}/100
</td>

</tr>

`;

}


if(!html){

html=`

<tr>

<td colspan="9"
class="empty">

No matching coins

</td>

</tr>

`;

}


document.getElementById("rows")
.innerHTML=
html;

}


/* -----------------------------
   FILTER
----------------------------- */

function setFilter(value){

filter=value;

render();

}


/* -----------------------------
   STATS
----------------------------- */

function updateStats(){

document.getElementById("total")
.textContent=
data.length;


let buyCount=
data.filter(
x=>x.signal==="BUY"
).length;


document.getElementById("buys")
.textContent=
buyCount;


let bullish=
data.filter(
x=>x.trend==="BULLISH"
).length;


let bearish=
data.filter(
x=>x.trend==="BEARISH"
).length;


let market="NEUTRAL";


if(bullish>bearish){

market="BULLISH";

}

else if(bearish>bullish){

market="BEARISH";

}


document.getElementById("market")
.textContent=
market;


if(data.length){

let average=
data.reduce(
(a,b)=>a+b.score,
0
)/data.length;


document.getElementById("avgScore")
.textContent=
Math.round(average);

}

}


/* -----------------------------
   START
----------------------------- */

scan();


/* AUTO REFRESH */

setInterval(
scan,
180000
);

</script>

</body>
</html>
