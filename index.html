<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoLeora Scanner</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070b11;
color:#f5f7fa;
font-family:Arial,sans-serif
}

header{
padding:16px;
background:#0d131c;
border-bottom:1px solid #202936;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:5
}

.logo{
font-size:20px;
font-weight:800
}

.live{
font-size:12px;
color:#35d88b
}

.container{
max-width:1200px;
margin:auto;
padding:15px
}

.controls{
display:flex;
gap:8px;
margin-bottom:15px;
flex-wrap:wrap
}

input{
flex:1;
min-width:180px;
background:#111923;
border:1px solid #263241;
border-radius:8px;
padding:12px;
color:white;
outline:none
}

button{
background:#17212d;
border:1px solid #263241;
color:white;
padding:11px 15px;
border-radius:8px;
font-weight:bold
}

button:active{
transform:scale(.97)
}

.scan{
background:#087c50;
border-color:#087c50
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px
}

.card{
background:#0d131c;
border:1px solid #202936;
border-radius:10px;
padding:14px
}

.label{
font-size:11px;
color:#8995a5;
margin-bottom:7px
}

.value{
font-size:20px;
font-weight:800
}

.green{color:#35d88b}
.red{color:#ff5968}
.yellow{color:#ffbf4a}

.box{
background:#0d131c;
border:1px solid #202936;
border-radius:10px;
overflow:hidden
}

.boxhead{
padding:15px;
font-weight:800;
border-bottom:1px solid #202936
}

.tablewrap{
overflow-x:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:950px
}

th,td{
padding:12px;
border-bottom:1px solid #1b2430;
text-align:left;
font-size:12px
}

th{
color:#8793a3;
font-size:11px;
background:#0b1017
}

.coin{
font-weight:800
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:15px;
font-size:10px;
font-weight:800
}

.buy{
color:#35d88b;
background:#103327
}

.sell{
color:#ff5968;
background:#35151b
}

.wait{
color:#ffbf4a;
background:#342915
}

.empty{
padding:35px;
text-align:center;
color:#8995a5
}

@media(max-width:700px){
.cards{
grid-template-columns:1fr 1fr
}

.container{
padding:10px
}

header{
padding:13px
}
}
</style>
</head>

<body>

<header>
<div class="logo">🚀 CryptoLeora</div>
<div class="live" id="status">● READY</div>
</header>

<div class="container">

<div class="controls">

<input
id="search"
placeholder="Search coin e.g. BTC, ETH, SUI"
oninput="render()">

<button class="scan" onclick="scan()">🔎 SCAN</button>

<button onclick="setFilter('ALL')">ALL</button>
<button onclick="setFilter('BUY')">BUY</button>
<button onclick="setFilter('SELL')">SELL</button>

</div>

<div class="cards">

<div class="card">
<div class="label">BTC PRICE</div>
<div class="value" id="btc">$--</div>
</div>

<div class="card">
<div class="label">COINS</div>
<div class="value" id="total">0</div>
</div>

<div class="card">
<div class="label">BUY SIGNALS</div>
<div class="value green" id="buys">0</div>
</div>

<div class="card">
<div class="label">MARKET</div>
<div class="value yellow" id="market">--</div>
</div>

</div>

<div class="box">

<div class="boxhead">
Market Scanner
</div>

<div class="tablewrap">

<table>

<thead>

<tr>
<th>COIN</th>
<th>PRICE</th>
<th>24H %</th>
<th>RSI</th>
<th>EMA TREND</th>
<th>BTC STRENGTH</th>
<th>SIGNAL</th>
<th>SCORE</th>
</tr>

</thead>

<tbody id="rows">

<tr>
<td colspan="8" class="empty">
Press SCAN to load market
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

let data=[];
let filter="ALL";

const coins=[
"BTCUSDT",
"ETHUSDT",
"XRPUSDT",
"SUIUSDT",
"OPUSDT",
"SEIUSDT",
"NEARUSDT",
"ARBUSDT",
"APTUSDT",
"LINKUSDT",
"ADAUSDT",
"DOGEUSDT",
"AVAXUSDT",
"DOTUSDT",
"ATOMUSDT",
"INJUSDT",
"FILUSDT",
"UNIUSDT",
"AAVEUSDT",
"PEPEUSDT"
];

async function getJSON(url){

const r=await fetch(url);

if(!r.ok) throw new Error("API");

return await r.json();

}

function ema(values,period){

if(values.length<period)return values[values.length-1];

let k=2/(period+1);

let e=values
.slice(0,period)
.reduce((a,b)=>a+b,0)/period;

for(let i=period;i<values.length;i++){

e=values[i]*k+e*(1-k);

}

return e;

}

function rsi(values){

if(values.length<15)return 50;

let gain=0;
let loss=0;

for(let i=values.length-14;i<values.length;i++){

let d=values[i]-values[i-1];

if(d>0)gain+=d;
else loss-=d;

}

if(loss===0)return 100;

let rs=gain/loss;

return Math.round(100-(100/(1+rs)));

}

async function analyze(symbol){

let url=
"https://api.binance.com/api/v3/klines?symbol="+
symbol+
"&interval=15m&limit=100";

let candles=await getJSON(url);

let close=candles.map(x=>Number(x[4]));

let price=close[close.length-1];

let e10=ema(close,10);
let e20=ema(close,20);
let e55=ema(close,55);

let R=rsi(close);

let trend="SIDEWAYS";

if(e10>e20 && e20>e55)
trend="BULLISH";

else if(e10<e20 && e20<e55)
trend="BEARISH";

let score=50;

if(e10>e20)score+=15;
else score-=15;

if(e20>e55)score+=15;
else score-=15;

if(R<40)score+=15;
else if(R>70)score-=15;

if(trend==="BULLISH")score+=10;
if(trend==="BEARISH")score-=10;

score=Math.max(0,Math.min(100,Math.round(score)));

let signal="WAIT";

if(
trend==="BULLISH" &&
R>=40 &&
R<65 &&
score>=65
){
signal="BUY";
}

if(
trend==="BEARISH" &&
R>70 &&
score<=35
){
signal="SELL";
}

return{
symbol:symbol.replace("USDT",""),
price,
rsi:R,
trend,
score,
signal
};

}

async function scan(){

document.getElementById("status").textContent="● SCANNING...";
document.getElementById("status").style.color="#ffbf4a";

data=[];

for(let symbol of coins){

try{

let x=await analyze(symbol);

data.push(x);

render();

}catch(e){

console.log(symbol,e);

}

}

document.getElementById("status").textContent="● LIVE";
document.getElementById("status").style.color="#35d88b";

updateStats();

}

function render(){

let q=
document.getElementById("search")
.value
.toUpperCase()
.trim();

let list=data.filter(x=>{

let okSearch=
!q ||
x.symbol.includes(q);

let okFilter=
filter==="ALL" ||
x.signal===filter;

return okSearch && okFilter;

});

let html="";

for(let x of list){

let pc=
x.price>=1
?x.price.toLocaleString(undefined,{maximumFractionDigits:4})
:x.price.toFixed(6);

let cls=
x.signal==="BUY"
?"buy":
x.signal==="SELL"
?"sell":
"wait";

html+=`

<tr>

<td class="coin">${x.symbol}</td>

<td>$${pc}</td>

<td>--</td>

<td>${x.rsi}</td>

<td>${x.trend}</td>

<td>--</td>

<td>
<span class="badge ${cls}">
${x.signal}
</span>
</td>

<td>${x.score}/100</td>

</tr>

`;

}

if(!html){

html=`
<tr>
<td colspan="8" class="empty">
No results
</td>
</tr>
`;

}

document.getElementById("rows").innerHTML=html;

}

function setFilter(x){

filter=x;

render();

}

function updateStats(){

document.getElementById("total").textContent=data.length;

document.getElementById("buys").textContent=
data.filter(x=>x.signal==="BUY").length;

let bullish=
data.filter(x=>x.trend==="BULLISH").length;

let bearish=
data.filter(x=>x.trend==="BEARISH").length;

let market="NEUTRAL";

if(bullish>bearish)
market="BULLISH";

if(bearish>bullish)
market="BEARISH";

document.getElementById("market").textContent=market;

}

async function getBTC(){

try{

let x=await getJSON(
"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"
);

document.getElementById("btc").textContent=
"$"+Number(x.price).toLocaleString(
undefined,
{maximumFractionDigits:2}
);

}catch(e){

document.getElementById("btc").textContent="--";

}

}

async function start(){

await getBTC();

}

start();

</script>

</body>
</html>
